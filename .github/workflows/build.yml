name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          modules: "qtshadertools"
          cache: true

      # Qt 6.8's macOS build still links against the AGL framework even
      # though nothing in modern Qt actually calls into it (dead link
      # metadata) — Apple has since dropped AGL.framework from the SDK
      # entirely, so `ld: framework 'AGL' not found` fails the link step.
      # Rather than hunt for an old Xcode that still ships it, satisfy the
      # linker with a tiny stub framework of our own.
      - name: Work around missing AGL framework
        if: matrix.name == 'macos'
        run: |
          mkdir -p "$RUNNER_TEMP/ExtraFrameworks/AGL.framework"
          echo 'static const int agl_stub = 0;' > "$RUNNER_TEMP/agl_stub.c"
          clang -dynamiclib -o "$RUNNER_TEMP/ExtraFrameworks/AGL.framework/AGL" "$RUNNER_TEMP/agl_stub.c" \
            -install_name "AGL" -current_version 1.0 -compatibility_version 1.0
          echo "AGL_FRAMEWORK_DIR=$RUNNER_TEMP/ExtraFrameworks" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-F${AGL_FRAMEWORK_DIR}"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          mkdir -p dist
          cp build/archi dist/

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Recurse -Filter archi.exe -Path build | Select-Object -First 1
          Copy-Item $exe.FullName dist/
          windeployqt dist/archi.exe

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: |
          macdeployqt build/archi.app
          mkdir -p dist
          cp -R build/archi.app dist/

      - uses: actions/upload-artifact@v4
        with:
          name: archi-${{ matrix.name }}
          path: dist/
